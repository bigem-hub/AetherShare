<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#788aa3"/>
      <stop offset="50%" stop-color="#92b6b1"/>
      <stop offset="100%" stop-color="#666a86"/>
    </linearGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#788aa3"/>
      <stop offset="100%" stop-color="#92b6b1"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b2c9ab"/>
      <stop offset="100%" stop-color="#e8ddb5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Orbital Rings / P2P Exchange Wave -->
  <path d="M 18 36 C 18 24, 30 18, 38 22 C 45 26, 48 35, 43 41 C 38 47, 26 46, 22 41" 
        stroke="url(#orbitGrad1)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 46 28 C 46 40, 34 46, 26 42 C 19 38, 16 29, 21 23 C 26 17, 38 18, 42 23" 
        stroke="url(#orbitGrad2)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Left node (Peer 1) -->
  <circle cx="21" cy="30" r="4.5" fill="#788aa3" stroke="#666a86" stroke-width="1.5"/>
  <circle cx="21" cy="30" r="2" fill="#e8ddb5"/>

  <!-- Right node (Peer 2) -->
  <circle cx="43" cy="34" r="4.5" fill="#92b6b1" stroke="#b2c9ab" stroke-width="1.5"/>
  <circle cx="43" cy="34" r="2" fill="#e8ddb5"/>

  <!-- Central Energy Pulse -->
  <circle cx="32" cy="32" r="3.5" fill="#e8ddb5" filter="url(#glow)"/>
  <path d="M 32 26 L 33 30 L 37 32 L 33 34 L 32 38 L 31 34 L 27 32 L 31 30 Z" fill="#ffffff" opacity="0.9"/>
</svg>
